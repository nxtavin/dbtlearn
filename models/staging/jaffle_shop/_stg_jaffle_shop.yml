models:
  - name: stg_jaffle_shop__customers
    columns:
      - name : customer_id
        data_tests:
          - not_null
          - unique
          
  - name: stg_jaffle_shop__orders
    columns:
      - name : order_id
        data_tests:
          - not_null
          - unique
          - relationships:
              to: ref('stg_jaffle_shop__customers')
              field: customer_id
      - name : status
        description: "{{ doc('order_types') }}"
        data_tests:
          - accepted_values:
              values:
                - completed
                - shipped
                - returned
                - return_pending
                - placed